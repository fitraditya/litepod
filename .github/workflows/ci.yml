name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # internal/usecase's host-volume tests chown to a fixed uid/gid, which
        # requires root (or CAP_CHOWN) - the same privilege this agent needs
        # in production to manage arbitrary host directories. The default
        # `runner` user doesn't have it, so run under sudo, preserving PATH so
        # the setup-go toolchain is still found.
        run: sudo -E env "PATH=$PATH" go test ./...
