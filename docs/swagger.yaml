  /webhook/containers/{name}/deploy:
    post:
      consumes:
      - application/json
      description: Pulls the image (must be from the repository the container already
        runs; uses configured `registries` credentials), then recreates the container
        from its existing config. Blocks until done; the old container is restored
        if the new one fails to start. A stopped container stays stopped. Only mounted
        when webhook_api_key is configured; the main X-API-KEY is not accepted here.
        Returns 409 if a redeploy of the same container is already running.
      parameters:
      - description: Container name
        in: path
        name: name
        required: true
        type: string
      - description: New image
        in: body
        name: body
        required: true
